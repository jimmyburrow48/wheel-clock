<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wheel Clock - a hamster's running log</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1a16; color: #f6e7c8; font-family: system-ui, sans-serif; }
    main { text-align: center; max-width: 420px; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p.note { opacity: .7; margin: 0 0 24px; }
    #wheel { font-size: 6rem; line-height: 1; display: inline-block; transition: transform .2s; }
    #wheel.spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #time { font-variant-numeric: tabular-nums; font-size: 3rem; margin: 16px 0 4px; }
    #laps { font-size: 1.1rem; margin-bottom: 20px; }
    button { font: inherit; padding: 10px 18px; margin: 4px; border-radius: 999px; border: 0; background: #e0a458; color: #1e1a16; cursor: pointer; }
    button.ghost { background: transparent; color: #f6e7c8; border: 1px solid #f6e7c8; }
    button:disabled { opacity: .4; cursor: default; }
    #log { list-style: none; padding: 0; margin: 20px 0 0; text-align: left; max-height: 180px; overflow-y: auto; }
    #log li { padding: 4px 0; border-bottom: 1px dashed #4a4037; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<main>
  <h1>Wheel Clock</h1>
  <p class="note">Press start, run, and count your laps. Jimmy the hamster approves.</p>
  <div id="wheel">&#x1F439;&#x1F6DE;</div>
  <div id="time">00:00.0</div>
  <div id="laps">Laps: <span id="lapCount">0</span></div>
  <div>
    <button id="start">Start</button>
    <button id="lap" class="ghost" disabled>Lap</button>
    <button id="reset" class="ghost">Reset</button>
  </div>
  <ol id="log"></ol>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let startedAt = 0, elapsed = 0, timer = null, laps = 0, lastLapAt = 0;

  function fmt(ms) {
    const s = Math.floor(ms / 1000), tenths = Math.floor((ms % 1000) / 100);
    const m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + '.' + tenths;
  }

  function now() { return performance.now(); }

  function tick() { $('time').textContent = fmt(elapsed + (now() - startedAt)); }

  $('start').addEventListener('click', () => {
    if (timer) {
      elapsed += now() - startedAt;
      clearInterval(timer); timer = null;
      $('wheel').classList.remove('spin');
      $('start').textContent = 'Resume';
      $('lap').disabled = true;
    } else {
      startedAt = now();
      timer = setInterval(tick, 100);
      $('wheel').classList.add('spin');
      $('start').textContent = 'Pause';
      $('lap').disabled = false;
    }
  });

  $('lap').addEventListener('click', () => {
    const total = elapsed + (now() - startedAt);
    const split = total - lastLapAt;
    lastLapAt = total;
    laps += 1;
    $('lapCount').textContent = laps;
    const li = document.createElement('li');
    li.textContent = 'Lap ' + laps + ' - ' + fmt(split) + ' (total ' + fmt(total) + ')';
    $('log').prepend(li);
  });

  $('reset').addEventListener('click', () => {
    clearInterval(timer); timer = null;
    startedAt = 0; elapsed = 0; laps = 0; lastLapAt = 0;
    $('time').textContent = '00:00.0';
    $('lapCount').textContent = '0';
    $('log').innerHTML = '';
    $('wheel').classList.remove('spin');
    $('start').textContent = 'Start';
    $('lap').disabled = true;
  });
</script>
</body>
</html>
